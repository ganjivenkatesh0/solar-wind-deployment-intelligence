services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: solar_wind_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d solar_wind_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres123@db:5432/solar_wind_db
      SRTM_RASTER_PATH: /app/datasets/raw/srtm/output_SRTMGL1.tif
      GWA_RASTER_PATH: /app/datasets/raw/global_wind_atlas/IND_wind-speed_50m.tif
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-}
    ports:
      - "8000:8000"
    volumes:
      - ./datasets/raw/global_wind_atlas:/app/datasets/raw/global_wind_atlas:ro
      - ./datasets/raw/srtm:/app/datasets/raw/srtm:ro
    depends_on:
      db:
        condition: service_healthy
